language = "C"
cpp_compat = true
include_guard = "HHM_DESKTOP_APP_H"
autogen_warning = "/* Generated by cbindgen. Update src/ffi.rs, then run `just ffi-generate`. */"
documentation = true
documentation_style = "c99"
usize_is_size_t = true

[parse]
parse_deps = false

[enum]
prefix_with_name = true

[export]
include = [
  "HhmDesktopHandle",
  "HhmDesktopStatus",
  "hhm_desktop_abi_version",
  "hhm_desktop_p2p_protocol_version",
  "hhm_desktop_handle_new",
  "hhm_desktop_handle_free",
  "hhm_desktop_set_auth_state",
  "hhm_desktop_set_product_access",
  "hhm_desktop_set_proximity",
  "hhm_desktop_set_qr_lease",
  "hhm_desktop_snapshot_json",
  "hhm_desktop_string_free",
]
